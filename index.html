.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.ch{width:120px;padding:10px;border-radius:16px;border:3px solid transparent;background:#fff3;cursor:pointer;font-size:12px}
.ch.sel{border-color:var(--accent)}
.ch.lock{opacity:.45;cursor:not-allowed}
.dot{width:46px;height:46px;border-radius:50%;margin:0 auto 6px;box-shadow:inset -5px -5px 0 #0002}

</style>
</head>
